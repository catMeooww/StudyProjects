<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revitalização do Lago Igapó</title>
    <link rel="stylesheet" href="lake.css">
    <link rel="shortcut icon" href="lake.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-database.js"></script>
    <script src="../datascript.js"></script>
    <style>
        #outdiv {
            width: 90%;
            height: 400px;
            background-color: white;
            justify-self: center;
            color: black;
            border: 2px outset black;
            text-align: left;
            padding: 4px;
            overflow-y: scroll;
        }

        #adddiv {
            width: 90%;
            background-color: white;
            justify-self: center;
            color: black;
            border: 2px solid black;
            text-align: left;
            padding: 4px;
        }

        #adddiv button {
            background-color: rgba(0, 0, 0, 0);
            float: right;
        }

        #outdiv p {
            border-bottom: 1px solid black;
        }

        #user{
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            visibility: hidden;
            padding: 10px;
            border: solid 1px black;
            position: fixed;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-items: center;
        }
    </style>
</head>

<body onload="loadRegisters()">
    <div id="user">
        <input placeholder="username" id="student">
        <button onclick="login()">Log-In</button>
    </div>
    <section class="menu">
        <button onclick="toggleUi()" style="float: left;" id="toggle-btn">←</button>
        <div class="toggable-ui">
            <button onclick="redirect(0)">Inicio</button>
            <button onclick="redirect(1)">Projetos</button>
            <button onclick="redirect(2)">Assinar</button>
        </div>
    </section>
    <section class="body">
        <h1>Ajude o projeto adicionando uma Assinatura</h1>
        <div id="outdiv"></div>
        <div id="adddiv" class="toggable-ui"></div>
        <br><br>
    </section>
    <script src="lake.js"></script>
    <script>
        function loadRegisters() {
            if (user && user != "") {
                document.getElementById("adddiv").innerHTML = "<label>Assinando como: " + user + " </label>";
                document.getElementById("adddiv").innerHTML += "<button onclick='register()'>Assinar</button>";
            } else {
                document.getElementById("adddiv").innerHTML = "<label>Faça login para assinar</label>";
                document.getElementById("adddiv").innerHTML += "<button onclick='logging()'>Log-In</button>";
            }
            firebase.database().ref("/lake/").on('value', function (snapshot) {
                document.getElementById("outdiv").innerHTML = "<p style='text-align:center'>Assinaturas</p>";
                snapshot.forEach(function (childSnapshot) {
                    childKey = childSnapshot.key; childData = childSnapshot.val();
                    document.getElementById("outdiv").innerHTML += "<p>[" + childData + "] " + childKey + "</p>";
                });
            })
        }
        function logging() {
            document.getElementById("user").style.visibility = "visible";
        }
        function register() {
            firebase.database().ref("/lake/").update({
                [user]: new Date().toLocaleDateString()
            });
        }
    </script>
</body>

</html>
