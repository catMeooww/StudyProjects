<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revitalização do Lago Igapó</title>
    <link rel="stylesheet" href="lake.css">
    <link rel="shortcut icon" href="lake.png" type="image/png">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <section class="menu">
        <button onclick="toggleUi()" style="float: left;" id="toggle-btn">←</button>
        <div class="toggable-ui">
            <button onclick="redirect(0)">Inicio</button>
            <button onclick="redirect(1)">Projetos</button>
            <button onclick="redirect(2)">Assinar</button>
        </div>
    </section>
    <section class="body">
        <h1>Exemplos de Projeto</h1>
        <div id="projects">
            <section id="frame"></section>
            <section id="switch">
                <p id="projectName"></p>
                <button onclick="changeModel('1')">🏝️</button>
            </section>
        </div>
        <ul>
            <li>Ilha</li>
            <p>Uma ilha artificial flutuante no meio do lago, com quiosques e um bom lugar para relaxar. Ideal para
                turismo.</p>
            <li>Revitalização das pistas de caminhada</li>
            <p>Refazer as pistas de caminhada e as pontes para que fiquem ainda mais agradáveis.</p>
        </ul>
    </section>
    <script src="lake.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        let scene, camera, renderer, controls;
        if (/iPhone|Android|iPad/i.test(navigator.userAgent)) {
            var width = window.innerWidth / 1.2;
            var height = window.innerHeight / 1.3;
        } else {
            var width = window.innerWidth / 1.15;
            var height = window.innerHeight / 1.2;
        }

        function init(model) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(
                60,
                width / height,
                0.1,
                1000
            );
            camera.position.set(0, -300, 88);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            document.getElementById("frame").appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.update();

            // Load MTL and OBJ
            const mtlLoader = new MTLLoader();
            mtlLoader.setPath('./lake_models/');
            mtlLoader.load(model + '.mtl', (materials) => {
                materials.preload();

                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.setPath('./lake_models/');
                objLoader.load(model + '.obj', (object) => {
                    object.scale.set(1, 1, 1);
                    object.position.set(0, 0, 0);
                    scene.add(object);
                });
            });

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            width = window.innerWidth / 1.2;
            height = window.innerHeight / 1.2;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        let url = window.location.href
        url = url.split("?")
        if (url.length == 2) {
            if (url[1] == "2") {
                var file = "island";
            } else {
                var file = "island";
            }
        } else {
            var file = "island";
        }
        document.getElementById("projectName").innerHTML = "Project: " + file;
        init(file);
    </script>
</body>

</html>
